name: Cập nhật dashboard Kindle

on:
  schedule:
    # Giờ trong cron là UTC (giờ VN = UTC + 7). GitHub có thể chạy trễ.
    # 8:00–23:45 giờ VN: 15 phút/lần (01:00–16:45 UTC)
    - cron: "*/15 1-16 * * *"
    # 0:00 và 4:00 giờ VN: 4 tiếng/lần (17:00, 21:00 UTC)
    - cron: "0 17,21 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # để lượt này tự hẹn lượt kế tiếp

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - name: Tải font Inter (nếu repo chưa có)
        continue-on-error: true
        run: |
          if [ ! -f fonts/Inter-Regular.otf ]; then
            mkdir -p fonts
            curl -fsSL --retry 3 --retry-delay 5 -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip
            unzip -j -o /tmp/inter.zip 'extras/otf/Inter-Regular.otf' 'extras/otf/Inter-Medium.otf' 'extras/otf/Inter-SemiBold.otf' 'extras/otf/Inter-Bold.otf' -d fonts
          fi
          ls -la fonts
      - name: Vẽ dashboard
        env:
          DATA_URL: ${{ secrets.DATA_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DASH_SKIP_CALENDARS: ${{ vars.DASH_SKIP_CALENDARS }}
          DASH_LAYOUT: ${{ vars.DASH_LAYOUT || 'claude' }}   # claude (mặc định: mức dùng + việc gần đây + danh ngôn) / daydu / lich
          # Điểm ảnh màn hình Kindle — Paperwhite 3: 1072 x 1448
          DASH_W: "1072"
          DASH_H: "1448"
          # Toạ độ thành phố cho thời tiết — sửa 2 số dưới (lấy từ Google Maps)
          DASH_LAT: "21.0285"
          DASH_LON: "105.8542"
          # Tiêu đề bố cục claude (tuỳ chọn)
          DASH_TITLE: "Claude"
          # Cỡ chữ: 1.05 mặc định cho Paperwhite 3, nhỏ hơn thì hiện được nhiều việc hơn
          DASH_SCALE: "1.05"
          DASH_FABLE_KEY: ${{ vars.DASH_FABLE_KEY }}
          SECRET_PATH: ${{ secrets.SECRET_PATH }}
        run: |
          python render.py --out "_site/${SECRET_PATH:-img}/dashboard.png"
          touch _site/index.html
          # ảnh mẫu (dữ liệu giả) để minh hoạ, ai cũng xem được
          python render.py --sample sample.json --now "2026-11-06T10:30" --out _site/preview.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub đôi khi chưa kịp ghi nhận artifact vừa tải lên → chờ một chút, lỗi thì thử lại 1 lần
      - name: Chờ GitHub ghi nhận artifact
        run: sleep 20
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Chờ trước khi thử lại
        if: steps.deploy.outcome == 'failure'
        run: sleep 40
      - name: Thử deploy lại
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # Lịch cron của GitHub hay trễ hàng giờ, nên mỗi lượt tự hẹn lượt kế tiếp:
  # chờ ~8 phút (ban đêm 0–8h giờ VN: chờ tới 4h hoặc 8h) rồi gọi lại chính workflow này.
  # Lượt mới (kể cả do cron/push) sẽ huỷ lượt đang chờ cũ, nên luôn chỉ có một chuỗi.
  hen-luot-ke-tiep:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: chuoi-hen-gio
      cancel-in-progress: true
    steps:
      - name: Chờ rồi gọi lượt kế tiếp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$(TZ=Asia/Ho_Chi_Minh date +%-H); m=$(TZ=Asia/Ho_Chi_Minh date +%-M)
          if [ "$h" -lt 8 ]; then
            if [ "$h" -lt 4 ]; then next=4; else next=8; fi
            s=$(( (next - h) * 3600 - m * 60 ))
          else
            s=480
          fi
          echo "Chờ ${s}s"
          sleep "$s"
          gh workflow run update.yml -R "$GITHUB_REPOSITORY" --ref main

